<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GeoHub</title>

  <!-- Leaflet (CDN) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    header { padding: 12px 16px; border-bottom: 1px solid #e5e5e5; }
    .app { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 49px); }
    aside { border-right: 1px solid #e5e5e5; padding: 12px; overflow: auto; }
    #map { height: 100%; }
    .row { margin-bottom: 10px; }
    .muted { color: #666; font-size: 12px; }
    button { cursor: pointer; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
    button:hover { background: #f6f6f6; }
    .dataset { padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; }
    .dataset h3 { margin: 0 0 6px 0; font-size: 14px; }
    .dataset code { font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <strong>GeoHub</strong>
    <span class="muted"> | UI local (Leaflet) consumindo a API do Vapor</span>
  </header>

  <div class="app">
    <aside>
      <div class="row">
        <button id="btnReload">Recarregar datasets</button>
      </div>

      <div class="row muted">
        Dica: primeiro gere pelo menos um dataset via <code>POST /stac/search</code>.
      </div>

      <div id="datasets"></div>
    </aside>

    <main id="map"></main>
  </div>

  <script>
    const apiBase = ""; // mesma origem (localhost:8080)

    const map = L.map("map").setView([-22.9, -43.2], 9); // RJ default
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let bboxLayer = null;

    function bboxToLatLngBounds(bbox) {
      // bbox = [minLon, minLat, maxLon, maxLat]
      const [minLon, minLat, maxLon, maxLat] = bbox;
      return L.latLngBounds([minLat, minLon], [maxLat, maxLon]);
    }

    function drawBBox(bbox) {
      if (!bbox || bbox.length !== 4) return;

      const bounds = bboxToLatLngBounds(bbox);

      if (bboxLayer) {
        map.removeLayer(bboxLayer);
      }

      bboxLayer = L.rectangle(bounds, { weight: 2 });
      bboxLayer.addTo(map);
      map.fitBounds(bounds, { padding: [20, 20] });
    }

    function renderDatasets(list) {
      const container = document.getElementById("datasets");
      container.innerHTML = "";

      if (!Array.isArray(list) || list.length === 0) {
        container.innerHTML = `<p class="muted">Nenhum dataset encontrado. Gere um via <code>POST /stac/search</code>.</p>`;
        return;
      }

      for (const ds of list) {
        const div = document.createElement("div");
        div.className = "dataset";

        const itemsCount = Array.isArray(ds.items) ? ds.items.length : 0;

        div.innerHTML = `
          <h3>Dataset</h3>
          <div><code>${ds.id}</code></div>
          <div class="muted">source: ${ds.source || "-"}</div>
          <div class="muted">items: ${itemsCount}</div>
          <div class="muted">createdAt: ${ds.createdAt || "-"}</div>
          <div style="margin-top:8px;">
            <button data-id="${ds.id}">Ver no mapa</button>
          </div>
        `;

        div.querySelector("button").addEventListener("click", async (e) => {
          const id = e.target.getAttribute("data-id");
          const res = await fetch(`${apiBase}/datasets/${id}`);
          if (!res.ok) {
            alert("Falha ao carregar dataset " + id);
            return;
          }
          const full = await res.json();

          // Tenta desenhar bbox do query (mais confiável para “área de interesse”)
          if (full.query && Array.isArray(full.query.bbox)) {
            drawBBox(full.query.bbox);
          } else {
            // fallback: tenta bbox do primeiro item
            const first = (full.items || [])[0];
            if (first && Array.isArray(first.bbox)) {
              drawBBox(first.bbox);
            }
          }
        });

        container.appendChild(div);
      }
    }

    async function loadDatasets() {
      const res = await fetch(`${apiBase}/datasets`);
      if (!res.ok) {
        document.getElementById("datasets").innerHTML =
          `<p class="muted">Erro ao buscar /datasets. Verifique se o servidor está rodando.</p>`;
        return;
      }
      const list = await res.json();
      renderDatasets(list);
    }

    document.getElementById("btnReload").addEventListener("click", loadDatasets);

    // auto-load
    loadDatasets();
  </script>
</body>
</html>
